[project]
name = "moneytrail"
version = "0.1.0"
description = "A merchant payment discrepancy investigator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "psycopg[binary]>=3.2.0",
    "ollama>=0.4.0",
    "langgraph>=0.2.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.3.0",
    "transformers>=4.44.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "reportlab>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moneytrail"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
